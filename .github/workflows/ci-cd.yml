name: CI/CD Pipeline - School Management System

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, TypeCheck & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Validate Prisma Schema & Generate Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Backend TypeScript Typecheck & Build
        working-directory: ./backend
        run: npm run build

  frontend-quality-and-build:
    name: Frontend Lint, TypeCheck & Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend for Production (Vite)
        working-directory: ./frontend
        run: npm run build

  security-audit:
    name: Dependency & Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backend Security Audit
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      - name: Run Frontend Security Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true
